<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- "D" letter made of separate geometric triangular segments radiating from center -->
  <!-- Each segment has a small gap to create the faceted/crystal look -->
  
  <!-- Center point: 14, 16 -->
  
  <!-- Left vertical stroke - top segment -->
  <polygon points="7,3 10.5,3 14,16" fill="#4ecdc4"/>
  <!-- Left vertical stroke - bottom segment -->
  <polygon points="7,29 10.5,29 14,16" fill="#2ab7a9"/>
  
  <!-- Top bar segment -->
  <polygon points="11,3 18,3 14,16" fill="#3ec9be"/>
  
  <!-- Upper-right curve segment -->
  <polygon points="18.5,3.5 24,8 14,16" fill="#2db5d6"/>
  
  <!-- Right curve - upper segment -->
  <polygon points="24.5,8.5 26,15 14,16" fill="#1e9ec8"/>
  
  <!-- Right curve - lower segment -->
  <polygon points="26,17 24.5,23.5 14,16" fill="#1e9ec8"/>
  
  <!-- Lower-right curve segment -->
  <polygon points="24,24 18.5,28.5 14,16" fill="#2db5d6"/>
  
  <!-- Bottom bar segment -->
  <polygon points="18,29 11,29 14,16" fill="#3ec9be"/>
</svg>
