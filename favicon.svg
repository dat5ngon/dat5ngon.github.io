<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Geometric D made of triangular facets with teal-blue gradient -->
  <!-- Left vertical bar of D (two triangles) -->
  <polygon points="10,4 13,16 10,16" fill="#4ecdc4"/>
  <polygon points="10,16 13,16 10,28" fill="#2ab7a9"/>
  
  <!-- Top facets -->
  <polygon points="10,4 13,16 18,6" fill="#3bbfb3"/>
  <polygon points="18,6 13,16 22,10" fill="#2196c8"/>
  
  <!-- Right facets -->
  <polygon points="22,10 13,16 23,16" fill="#1e88c0"/>
  <polygon points="23,16 13,16 22,22" fill="#2196c8"/>
  
  <!-- Bottom facets -->
  <polygon points="22,22 13,16 18,26" fill="#3bbfb3"/>
  <polygon points="18,26 13,16 10,28" fill="#4ecdc4"/>
</svg>
